name: Deploy Cuenora public beta

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch current Cuenora source snapshot
        run: |
          git clone --depth 1 https://github.com/itsHALE101/cuenora-beta.git src

      - name: Build deployment allowlist
        run: |
          set -euo pipefail
          mkdir -p public

          # Only files required by the browser are allowed into the public deployment.
          for f in index.html privacy.html beta-test.html manifest.webmanifest icon.svg; do
            test -f "src/$f"
            cp "src/$f" "public/$f"
          done

          # Minify CSS.
          npx --yes csso-cli@4.0.2 src/cuenora.css --output public/cuenora.css

          # Minify/mangle browser JavaScript. The service worker keeps the same public filename.
          for f in cuenora-app.js smart-dump.js assist.js voice.js cloud-config.js privacy-crypto.js cloud.js sw.js; do
            test -f "src/$f"
            npx --yes terser@5.44.0 "src/$f" --compress --mangle --comments false --output "public/$f"
          done

          # Minify HTML, including inline test-page code, while keeping behavior unchanged.
          for f in index.html privacy.html beta-test.html; do
            npx --yes html-minifier-terser@7.2.0 "public/$f" \
              --collapse-whitespace \
              --remove-comments \
              --remove-redundant-attributes \
              --remove-script-type-attributes \
              --remove-style-link-type-attributes \
              --minify-css true \
              --minify-js true \
              --output "public/$f.min"
            mv "public/$f.min" "public/$f"
          done

          # Do not expose the private-development repository through the beta bug-report link.
          python - <<'PY'
          from pathlib import Path
          p = Path('public/beta-test.html')
          s = p.read_text()
          s = s.replace('https://github.com/itsHALE101/cuenora-beta/issues/new?template=beta-feedback.md', '#feedbackForm')
          s = s.replace('Report a technical problem', 'Use the feedback form above')
          p.write_text(s)
          PY

          # Hard fail if internal-only material somehow enters the public artifact.
          forbidden='ADHD-PRODUCT-RESEARCH|DPIA-DRAFT|PRIVACY-SECURITY|MODEL-STACK|BUSINESS-MODEL|USER-INTERVIEWS|TESTER-STUDY|supabase/functions|service_role|SUPABASE_SERVICE_ROLE_KEY'
          if grep -R -nE "$forbidden" public; then
            echo 'Internal-only material detected in public artifact.'
            exit 1
          fi

          echo 'Public deployment files:'
          find public -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
