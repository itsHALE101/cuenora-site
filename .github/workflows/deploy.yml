name: Deploy Cuenora public beta

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - site/**
      - .github/workflows/deploy.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment artifact
        uses: actions/checkout@v6

      - name: Verify public artifact allowlist
        run: |
          set -euo pipefail
          test -d site

          expected=$(printf '%s\n' \
            assist.js \
            beta-test.html \
            cloud-config.js \
            cloud.js \
            cuenora-app.js \
            cuenora.css \
            icon.svg \
            index.html \
            manifest.webmanifest \
            privacy-crypto.js \
            privacy.html \
            smart-dump.js \
            sw.js \
            voice.js | sort)
          actual=$(find site -maxdepth 1 -type f -printf '%f\n' | sort)
          test "$actual" = "$expected"

          forbidden='ADHD-PRODUCT-RESEARCH|DPIA-DRAFT|PRIVACY-SECURITY|MODEL-STACK|BUSINESS-MODEL|USER-INTERVIEWS|TESTER-STUDY|supabase/functions|service_role|SUPABASE_SERVICE_ROLE_KEY|github.com/itsHALE101/cuenora-beta|itshale101.github.io/cuenora-beta/'
          if grep -R -nE "$forbidden" site; then
            echo 'Internal-only material or an old source-site link was detected in the public artifact.'
            exit 1
          fi

          if find site -type f -name '*.map' | grep -q .; then
            echo 'Source map detected in public artifact.'
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload verified Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
